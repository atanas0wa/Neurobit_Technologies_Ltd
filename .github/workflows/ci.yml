# Continuous integration: typecheck, builds, unit and end-to-end tests.
# Actions are pinned to commit SHAs (tag in the trailing comment) and the
# workflow only needs read access to the repository.
name: CI

on:
  pull_request:
  push:
    branches: [feat/website, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.26.1
  NODE_VERSION: "24"

jobs:
  checks:
    name: Typecheck, build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Root build = typecheck + every package build, with no PORT/BASE_PATH set.
      - run: pnpm run build
      - run: pnpm run test
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  e2e:
    name: Website end-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/website exec playwright install --with-deps chromium
      # Two static builds: a fake Formspree ID and none. Tests intercept every
      # request to formspree.io, so nothing reaches the real endpoint.
      - run: pnpm --filter @workspace/website run test:e2e:build
      - run: pnpm --filter @workspace/website run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            artifacts/website/playwright-report
            artifacts/website/test-results
          retention-days: 7

  install-build:
    name: Install and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # Native binaries (esbuild, rollup, lightningcss, Tailwind oxide) must
      # resolve for this platform from the lockfile.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/website run build
      - run: pnpm --filter @workspace/api-server run build
      - run: pnpm --filter @workspace/mockup-sandbox run build
